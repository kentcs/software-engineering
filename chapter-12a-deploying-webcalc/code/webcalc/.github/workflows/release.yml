name: Deploy WebCalc

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webcalc-deploy
  cancel-in-progress: false

jobs:
  test:
    name: WebCalc / ${{ matrix.layer }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, simulated-gui, browser]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test calculator logic
        if: matrix.layer == 'unit'
        run: python -m pytest -v test_calculator.py --junitxml=test-results/unit.xml
      - name: Test simulated GUI
        if: matrix.layer == 'simulated-gui'
        run: python -m pytest -v test_main.py --junitxml=test-results/simulated-gui.xml
      - name: Test in headless Chrome
        if: matrix.layer == 'browser'
        run: |
          google-chrome --version
          python run_browser_tests.py --junit --junit-directory test-results
      - name: Save test reports and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcalc-${{ matrix.layer }}
          path: |
            test-results/
            browser-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up SSH
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy and restart WebCalc
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes main.py calculator.py requirements.txt webcalc@webcalc.kentcs.org:/home/webcalc/
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes webcalc@webcalc.kentcs.org 'bash -s' < scripts/deploy.sh
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
